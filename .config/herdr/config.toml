# Herdr configuration managed by dotfiles.
# The keys below preserve the existing tmux muscle memory where Herdr has an
# equivalent action.

onboarding = false

[terminal]
# Keep new tabs and panes in the focused pane or workspace directory.
new_cwd = "follow"

[ui]
# Capture mouse selection in Herdr and copy the selected text to the macOS
# system clipboard immediately. Copy mode retains Herdr's built-in v/y keys.
mouse_capture = true
copy_on_select = true

[keys]
prefix = "ctrl+a"

# Panes
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
resize_mode = "prefix+r"

# Tabs
previous_tab = "prefix+ctrl+n"
next_tab = "prefix+ctrl+p"

# Session controls
copy_mode = "prefix+esc"
detach = "prefix+d"
reload_config = "prefix+shift+r"
